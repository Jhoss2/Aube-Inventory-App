workflows:
  full-cross-platform-workflow:
    name: U-Auben Inventory App - Production Build
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - keystore_reference # Nom de votre keystore configuré dans Codemagic (à supprimer si vous ne signez pas encore)
      node: 20.11.0
      java: 17
      groups:
        - default
      vars:
        GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m'

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          npx expo install --check || echo "Ignored warnings"

      - name: Verify Assets & Clean
        script: |
          echo "--- Nettoyage ---"
          rm -rf android
          rm -rf .expo

      - name: Generate Native Android Folder
        script: |
          npx expo prebuild --platform android --clean --no-install

      - name: Build APK & AAB Release
        script: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease bundleRelease -x lint -x test --no-daemon

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
