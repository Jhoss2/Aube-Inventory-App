workflows:
  full-cross-platform-workflow:
    name: U-Auben Inventory App - Build Complet (Android APK & Windows EXE)
    max_build_duration: 60
    instance_type: windows_x2
    environment:
      node: 20.11.0
      java: 17
      groups:
        - default
      vars:
        GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m'

    scripts:
      - name: Installation des dépendances
        script: |
          npm install --legacy-peer-deps

      # ── 1. GENERATION DU FICHIER APK (ANDROID) ────────────────────────────
      - name: Préparation du projet Android
        script: |
          npx expo prebuild --platform android --clean --no-install

      - name: Compilation de l'APK Release
        script: |
          cd android
          gradlew.bat clean
          gradlew.bat assembleRelease -x lint -x test --no-daemon
          cd ..

      # ── 2. GENERATION DU FICHIER EXE (WINDOWS) ────────────────────────────
      - name: Export Web Expo pour Electron
        script: |
          npx expo export --platform web

      - name: Encapsulation & Build de l'exécutable Windows (.exe)
        script: |
          npm install --save-dev electron electron-packager
          npx electron-packager . "UAubenInventoryApp" --platform=win32 --arch=x64 --out=dist-win --overwrite

    # ── ARTEFACTS GENERES A LA FIN DU BUILD ────────────────────────────────
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - dist-win/**/*.exe
      - dist-win/**/*.zip
