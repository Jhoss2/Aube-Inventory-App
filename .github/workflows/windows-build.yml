name: Build Native Windows App (React Native Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-native-windows:
    runs-on: windows-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installation des dépendances du projet
        run: npm install --legacy-peer-deps

      - name: Installation de la CLI et du package React Native Windows
        run: npm install --save-dev @react-native-community/cli react-native-windows

      - name: Ajout et configuration de React Native Windows
        run: |
          npx react-native init-windows --overwrite --silent
        shell: cmd

      - name: Compilation de l'application native Windows (.exe / MSIX)
        run: |
          npx react-native run-windows --arch x64 --no-launch --release
        shell: cmd

      - name: Compression et préparation de l'artefact natif
        shell: powershell
        run: |
          $buildPath = Get-ChildItem -Recurse -Filter "AppPackages" | Select-Object -ExpandProperty FullName
          if (-not $buildPath) {
            $buildPath = "windows/U-AubenInventoryApp/AppPackages"
          }
          Compress-Archive -Path "$buildPath" -DestinationPath "UAubenInventoryApp-Native-Windows.zip" -Force

      - name: Publication de l'artefact Windows natif
        uses: actions/upload-artifact@v4
        with:
          name: UAubenInventoryApp-Native-Windows
          path: UAubenInventoryApp-Native-Windows.zip
