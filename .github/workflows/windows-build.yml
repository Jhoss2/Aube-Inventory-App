name: Build Windows Native Executable (.exe)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation des dépendances
        run: npm install --legacy-peer-deps

      - name: Installation des dépendances Web requises pour l'export
        run: npx expo install react-dom react-native-web

      - name: Export Web Expo pour Electron
        run: npx expo export --platform web

      - name: Création du fichier de démarrage Electron (main.js)
        shell: cmd
        run: |
          echo const { app, BrowserWindow } = require('electron'); > main.js
          echo const path = require('path'); >> main.js
          echo function createWindow() { >> main.js
          echo   const win = new BrowserWindow({ width: 1200, height: 800 }); >> main.js
          echo   win.loadURL(`file://${path.join(__dirname, 'dist/index.html')}`); >> main.js
          echo } >> main.js
          echo app.whenReady().then(createWindow); >> main.js

      - name: Ajout du point d'entrée main dans package.json
        shell: powershell
        run: |
          $content = Get-Content package.json -Raw | ConvertFrom-Json
          $content | Add-Member -Type NoteProperty -Name "main" -Value "main.js" -Force
          $content | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Packaging de l'application Windows (.exe)
        run: |
          npm install --save-dev electron electron-packager
          npx electron-packager . "UAubenInventoryApp" --platform=win32 --arch=x64 --out=dist-win --overwrite

      - name: Compression du dossier Windows en ZIP
        shell: powershell
        run: |
          Compress-Archive -Path "dist-win/UAubenInventoryApp-win32-x64" -DestinationPath "UAubenInventoryApp-Windows.zip" -Force

      - name: Publication de l'artefact (Téléchargement)
        uses: actions/upload-artifact@v4
        with:
          name: UAubenInventoryApp-Windows-EXE
          path: UAubenInventoryApp-Windows.zip
