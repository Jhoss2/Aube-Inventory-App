name: Build Windows App (.exe)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Node.js (Correctif Lockfile)
      uses: actions/setup-node@v4
      with:
        node-version: 18
        # Suppression de la ligne cache: 'npm' car vous n'avez pas de package-lock.json

    - name: Configurer les outils de build Microsoft
      uses: microsoft/setup-msbuild@v2

    - name: Installer les dépendances NPM
      run: |
        npm install --legacy-peer-deps
        npm install react-native-windows@0.76.0 --save-dev --legacy-peer-deps

    - name: Créer le répertoire pour le bundle Windows
      run: |
        mkdir -p windows/uaubeninventoryapp/Bundle
      continue-on-error: true

    - name: Compiler le Bundle JavaScript autonome (index.windows.js)
      run: |
        npx react-native bundle --platform windows --dev false --entry-file index.windows.js --bundle-output windows/uaubeninventoryapp/Bundle/index.windows.bundle --assets-dest windows/uaubeninventoryapp/Bundle

    - name: Compiler le binaire Windows (.exe)
      run: |
        npx react-native run-windows --logging --release --arch x64 --no-launch --no-packager
