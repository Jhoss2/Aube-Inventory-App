name: Build Offline Native Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-native-windows:
    runs-on: windows-2022

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configuration de l'environnement MSBuild / C++
        uses: microsoft/setup-msbuild@v2

      - name: Installation des dépendances
        run: npm install --legacy-peer-deps

      - name: Ajout des packages natifs React Native Windows
        run: |
          npm install --save-dev react-native-windows @react-native-community/cli
        shell: cmd

      - name: Génération des fichiers natifs C++ / Windows
        run: |
          npx react-native-windows-init --overwrite --language cpp
        shell: cmd

      - name: Compilation de l'exécutable natif (.exe / .msix)
        run: |
          npx react-native run-windows --arch x64 --logging --no-launch --release
        shell: cmd

      - name: Préparation du fichier natif hors-ligne (.zip)
        shell: powershell
        run: |
          $buildFolder = Get-ChildItem -Recurse -Filter "AppPackages" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          if (-not $buildFolder) {
            $buildFolder = "windows/x64/Release"
          }
          Compress-Archive -Path "$buildFolder" -DestinationPath "U-Auben-Inventory-Native-Offline.zip" -Force

      - name: Publication de l'application native Windows
        uses: actions/upload-artifact@v4
        with:
          name: U-Auben-Inventory-Native-Offline
          path: U-Auben-Inventory-Native-Offline.zip
