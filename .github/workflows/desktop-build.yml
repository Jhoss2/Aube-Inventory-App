name: Build Native Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-native-windows:
    runs-on: windows-2022

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configuration de MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Installation des dépendances du projet
        run: npm install --legacy-peer-deps

      - name: Installation de la dépendance React Native Windows
        run: npm install --save-dev react-native-windows

      - name: Initialisation de la plateforme Windows
        run: npx react-native windows --overwrite --silent
        shell: cmd

      - name: Compilation de l'application native Windows
        run: npx react-native run-windows --arch x64 --no-launch --release
        shell: cmd

      - name: Compression de l'artefact natif
        shell: powershell
        run: |
          $buildPath = Get-ChildItem -Recurse -Filter "AppPackages" | Select-Object -ExpandProperty FullName -First 1
          if (-not $buildPath) {
            $buildPath = "windows/U-AubenInventoryApp/AppPackages"
          }
          Compress-Archive -Path "$buildPath" -DestinationPath "UAubenInventoryApp-Native-Windows.zip" -Force

      - name: Publication de l'artefact Windows natif
        uses: actions/upload-artifact@v4
        with:
          name: UAubenInventoryApp-Native-Windows
          path: UAubenInventoryApp-Native-Windows.zip
