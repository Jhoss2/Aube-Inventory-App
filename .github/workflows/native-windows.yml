name: Native Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer MSBuild (Outils natifs Windows)
        uses: microsoft/setup-msbuild@v2

      - name: Installer les dépendances du projet
        run: npm install --legacy-peer-deps

      - name: Installer le paquet React Native Windows compatible
        run: npm install react-native-windows@0.74.0 --save-dev --legacy-peer-deps
        shell: cmd

      - name: Initialiser l'environnement Windows natif
        run: npx react-native-windows-init --overwrite --no-telenergy
        shell: cmd

      - name: Compiler l'application native en mode Release
        run: npx react-native run-windows --arch x64 --no-launch --release
        shell: cmd

      - name: Compacter le dossier d'installation natif
        shell: powershell
        run: |
          $target = Get-ChildItem -Recurse -Filter "AppPackages" | Select-Object -ExpandProperty FullName -First 1
          if (-not $target) { 
            $target = Get-ChildItem -Path "windows" -Directory | Select-Object -ExpandProperty FullName -First 1
          }
          Write-Host "Dossier cible trouvé: $target"
          Compress-Archive -Path "$target" -DestinationPath "U-Auben-Inventory-App-Windows.zip" -Force

      - name: Télécharger l'artefact exécutable
        uses: actions/upload-artifact@v4
        with:
          name: U-Auben-Inventory-App-Windows
          path: U-Auben-Inventory-App-Windows.zip
